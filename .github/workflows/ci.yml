name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Training smoke run
        run: python -m triage.train

      - name: Upload model and metrics
        uses: actions/upload-artifact@v7
        with:
          name: model-${{ github.sha }}
          path: artifacts/
          retention-days: 14

  docker-build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image (no push)
        run: docker build -t diabetes-triage:ci .
